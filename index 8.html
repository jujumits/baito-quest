<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09291f"><title>Baito Quest</title><style>
*{box-sizing:border-box}body{margin:0;background:#09291f;color:white;font-family:system-ui,-apple-system,sans-serif}main{max-width:520px;margin:auto;padding:12px 14px 28px}.panel{background:#123c2f;border:1px solid #2b6550;border-radius:16px;padding:15px;margin-bottom:12px}.muted{font-size:12px;color:#b9dfc9}.money{font-size:clamp(48px,12vw,64px);font-weight:900;color:#63f49c;text-align:center;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.brand{text-align:center;color:#bdf4cf;font-weight:900;letter-spacing:3px;font-size:12px}.message{text-align:center;color:#e5ffe6;font-weight:800;margin-top:9px;min-height:24px}button{border:0;border-radius:10px;padding:12px 8px;font-weight:800;font-size:14px;cursor:pointer}button:disabled{opacity:.4}input{min-width:0;width:100%;background:#082b21;color:white;border:1px solid #458b6a;border-radius:9px;padding:10px 6px;font-size:16px}input::placeholder{color:#92a49b;opacity:1}input[type=checkbox]{width:18px;height:18px;accent-color:#48df82}input:disabled{opacity:.5}.green{background:#48df82;color:#082b1d}.dark{background:#285f49;color:white}.yellow{background:#f4ca69;color:#3d2805}.red{background:#73403e;color:white}.two,.stats,.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#092d22;border-radius:11px;padding:12px}.stat strong{display:block;color:white!important;font-size:18px;margin-top:5px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}.track{height:11px;background:#072319;border-radius:20px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#37ce78,#b3ff91)}.schedrow{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 39px;gap:8px;align-items:center;margin-top:10px}.schedrow input{font-size:12px;padding:9px 2px;min-width:0;max-width:100%;overflow:hidden}.schedrow input[type=time]{font-size:12px;letter-spacing:-.5px}.schedwrap{overflow:hidden;border-radius:9px;margin-top:9px}.schedwrap .schedrow{margin-top:0;padding:7px 0;touch-action:pan-y;transition:transform .18s,opacity .18s}.cal{background:#29483e;color:#d5e5dc;padding:0;min-height:39px;width:39px;display:flex;align-items:center;justify-content:center}.cal svg{width:25px;height:25px;stroke:#d5e5dc;stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}.hidden{display:none!important}.end{min-height:calc(100dvh + 40px);display:flex;flex-direction:column;text-align:center;position:relative;overflow:hidden}.end-content{position:relative;z-index:1;padding-top:clamp(100px,18vh,180px)}.end-footer{position:relative;z-index:2;margin-top:auto;padding-top:30px}.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}.piece{position:absolute;top:-20px;width:9px;height:15px;background:var(--c);animation:fall var(--dur) linear var(--delay) forwards}@keyframes fall{to{transform:translateX(var(--drift)) translateY(100vh) rotate(900deg);opacity:0}}.overlay{position:fixed;inset:0;background:#000e;display:flex;align-items:flex-start;justify-content:center;padding:15px;z-index:5}.calendar{background:#123c2f;border:1px solid #458b6a;border-radius:16px;padding:16px;width:100%;max-width:450px;margin-top:45px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.day{background:#245741;color:white;border-radius:7px;padding:9px 0;font-size:12px}.day.selected{background:#63f49c;color:#09291f}.day.today{outline:3px solid #ffd66b;outline-offset:-3px;box-shadow:0 0 0 1px #fff5c4;font-weight:900}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}summary{font-weight:800;color:#c6f6d9;cursor:pointer}.settings-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.settings-tabs button{background:#204b3a;color:#c6f6d9;border:1px solid #326d53;padding:12px 5px}.settings-tabs button.active{background:#48df82;color:#082b1d}.settings-pane.hidden{display:none!important}
input[type="number"],input[type="time"]{color:#fff;-webkit-text-fill-color:#fff;color-scheme:dark}input[type="time"]::-webkit-date-and-time-value{color:#fff;-webkit-text-fill-color:#fff;text-align:center}input[type="time"]::-webkit-datetime-edit{color:#fff;-webkit-text-fill-color:#fff}input[type="time"]::-webkit-datetime-edit-text,input[type="time"]::-webkit-datetime-edit-hour-field,input[type="time"]::-webkit-datetime-edit-minute-field{color:#fff;-webkit-text-fill-color:#fff}.end{min-height:100dvh!important;height:100dvh!important;overflow:hidden!important;padding-bottom:calc(12px + env(safe-area-inset-bottom))!important}.end-footer{position:sticky!important;bottom:0!important;margin-top:auto!important;padding-top:8px!important;background:#09291f!important}.end-footer button{background:#143e30!important;color:#c4e7d2!important;border:1px solid #37785a!important}.end-content{padding-top:clamp(30px,8vh,80px)!important}</style></head><body><main><div id="home"><section class="panel"><div class="brand">⚔ BAITO QUEST ⚔</div><p class="muted" style="text-align:center;margin:15px 0 0">現在の獲得金額</p><div id="money" class="money">¥0.00</div><div id="message" class="message">🌱 今日もがんばろう！</div></section><div class="settings-tabs" role="tablist" aria-label="設定切り替え"><button id="workTab" class="active" type="button" role="tab" aria-selected="true">勤務設定</button><button id="scheduleTab" type="button" role="tab" aria-selected="false">スケジュール設定</button></div><div id="workPane" class="settings-pane"><section class="panel"><div class="two" style="margin-top:0"><div><label class="muted">時給（円）</label><input id="wage" type="number" inputmode="numeric" min="1" value="1200"></div><div><label class="muted">勤務時間（任意）</label><div class="two" style="gap:6px"><div><input id="hours" type="number" min="0" inputmode="numeric" placeholder="0"><div class="muted" style="text-align:center">時間</div></div><div><input id="minutes" type="number" min="0" max="59" inputmode="numeric" placeholder="00"><div class="muted" style="text-align:center">分</div></div></div></div></div><p class="muted">時間を設定しなければ、終了ボタンまで計測するよ。</p><div class="actions"><button id="start" class="green">▶ スタート</button><button id="pause" class="dark" disabled>⏸ 一時停止</button><button id="stop" class="yellow" disabled>🏁 終了</button><button id="reset" class="red">↺ リセット</button></div></section></div><div id="schedulePane" class="settings-pane hidden"><section class="panel"><div class="schedrow muted" style="text-align:center;margin-top:0"><span></span><span>開始</span><span>終了</span><span>時給</span><span>日程</span></div><div id="rows"></div><button id="add" class="dark" style="width:100%;margin-top:12px">＋ スケジュールを追加</button><p class="muted">チェックした予定を自動適用。予定を右にスワイプすると削除できるよ。</p></section></div><section class="panel"><div class="stats"><div class="stat"><div class="muted">経過時間</div><strong id="elapsed">00:00:00</strong></div><div class="stat"><div class="muted">残り時間</div><strong id="remaining">--:--:--</strong></div><div class="stat"><div class="muted">1分あたり</div><strong id="perMinute">¥20</strong></div><div class="stat"><div class="muted">今日の目標金額</div><strong id="target">未設定</strong></div></div><div class="row muted" style="margin:15px 0 8px"><span>勤務進捗</span><b id="percent">時間未設定</b></div><div class="track"><div id="progress" class="fill"></div></div><div style="text-align:center;margin-top:14px"><div class="muted">現在のランク</div><div id="rank" style="font-size:24px;color:#f4d47b;font-weight:900">RANK 1</div></div></section></div><section id="end" class="end hidden"><div id="confetti" class="confetti"></div><div class="end-content"><div style="font-size:52px">🎉🎊🎉</div><div style="font-size:clamp(42px,11vw,72px);font-weight:900;color:#f9dd80;margin:22px 0 24px;white-space:nowrap;letter-spacing:-2.5px;text-align:center">QUEST CLEAR!</div><div style="font-size:24px;font-weight:900">お疲れ様！！</div><p style="color:#bceccc;font-size:14px">今日もよく頑張ったね！✨</p><div class="panel" style="background:#174e36;border-color:#63db91;margin-top:22px"><div class="muted">本日の獲得金額</div><div id="finalMoney" class="money">¥0</div></div><div class="stats" style="text-align:left;margin-bottom:22px"><div class="stat"><div class="muted">勤務時間</div><strong id="finalTime">00:00:00</strong></div><div class="stat"><div class="muted">獲得ランク</div><strong id="finalRank">RANK 1</strong></div></div></div><div class="end-footer"><button id="again" class="green" style="width:100%">🏠 ホームに戻る</button></div></section></main><div id="overlay" class="overlay hidden"><div class="calendar"><b>📅 勤務日を選択</b><div class="row" style="margin:13px 0"><button id="prev" class="dark">‹</button><b id="month"></b><button id="next" class="dark">›</button></div><div class="days muted" style="text-align:center;margin-bottom:7px"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="days" class="days"></div><p id="count" class="muted">0日選択中</p><div class="two"><button id="cancel" class="dark">キャンセル</button><button id="saveCal" class="green">保存</button></div></div></div>
<script>
(()=>{const work=document.getElementById("workPane"),schedule=document.getElementById("schedulePane"),wt=document.getElementById("workTab"),st=document.getElementById("scheduleTab");function choose(which){const a=which==="work";work.classList.toggle("hidden",!a);schedule.classList.toggle("hidden",a);wt.classList.toggle("active",a);st.classList.toggle("active",!a);wt.setAttribute("aria-selected",String(a));st.setAttribute("aria-selected",String(!a));}wt.addEventListener("click",()=>choose("work"));st.addEventListener("click",()=>choose("schedule"));})();

(()=>{const $=id=>document.getElementById(id),pad=n=>String(Math.floor(n)).padStart(2,'0'),yen=n=>'¥'+Math.round(Math.max(0,n)).toLocaleString('ja-JP'),money=n=>'¥'+Math.max(0,n).toLocaleString('ja-JP',{minimumFractionDigits:2,maximumFractionDigits:2}),clock=n=>{n=Math.max(0,Math.floor(n));return `${pad(n/3600)}:${pad(n%3600/60)}:${pad(n%60)}`},dateKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
let state={status:'idle',mode:'manual',wage:1200,duration:0,elapsed:0,earned:0,last:0,active:null},rows=[],counter=0,editing=null,month=new Date(),selected=new Set(),completedShifts=new Set();const calIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18M8 14h2M14 14h2M8 18h2"/></svg>';
function save(){try{localStorage.setItem('bq-v7-original-chat',JSON.stringify({state,rows,counter,completed:[...completedShifts],wage:$('wage').value,hours:$('hours').value,minutes:$('minutes').value}))}catch(e){}}
function addRow(data={}){rows.push({id:data.id||'r'+(++counter),enabled:data.enabled??true,start:data.start||'09:00',end:data.end||'17:00',rate:data.rate||$('wage').value||'1200',dates:Array.isArray(data.dates)?data.dates:[]});renderRows();save()}
function renderRows(){$('rows').innerHTML='';rows.forEach(r=>{const wrap=document.createElement('div');wrap.className='schedwrap';wrap.innerHTML='<div class="schedrow"><input type="checkbox" aria-label="有効"><input type="time" aria-label="開始時刻"><input type="time" aria-label="終了時刻"><input type="number" inputmode="numeric" aria-label="時給"><button class="cal" type="button" aria-label="日程を選択">'+calIcon+'</button></div>';const el=wrap.firstChild,a=el.querySelectorAll('input');a[0].checked=r.enabled;a[1].value=r.start;a[2].value=r.end;a[3].value=r.rate;a.forEach((input,i)=>input.addEventListener(i===0?'change':'input',()=>{if(i===0)r.enabled=input.checked;if(i===1)r.start=input.value;if(i===2)r.end=input.value;if(i===3)r.rate=input.value;save()}));el.querySelector('button').onclick=()=>{editing=r.id;selected=new Set(r.dates);month=new Date();month.setDate(1);renderCal();$('overlay').classList.remove('hidden')};let x=0,y=0;el.addEventListener('touchstart',e=>{x=e.touches[0].clientX;y=e.touches[0].clientY},{passive:true});el.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x,dy=e.changedTouches[0].clientY-y;if(dx>85&&Math.abs(dx)>Math.abs(dy)*1.3){el.style.transform='translateX(110%)';el.style.opacity='0';setTimeout(()=>{rows=rows.filter(v=>v.id!==r.id);renderRows();save()},190)}},{passive:true});$('rows').appendChild(wrap)})}
function renderCal(){const y=month.getFullYear(),m=month.getMonth(),today=dateKey(new Date());$('month').textContent=`${y}年${m+1}月`;$('days').innerHTML='';for(let i=0;i<new Date(y,m,1).getDay();i++)$('days').appendChild(document.createElement('span'));for(let d=1;d<=new Date(y,m+1,0).getDate();d++){const key=dateKey(new Date(y,m,d)),b=document.createElement('button');b.className='day'+(selected.has(key)?' selected':'')+(key===today?' today':'');b.textContent=d;b.onclick=()=>{selected.has(key)?selected.delete(key):selected.add(key);renderCal()};$('days').appendChild(b)}$('count').textContent=selected.size+'日選択中'}
$('prev').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);renderCal()};$('next').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);renderCal()};$('cancel').onclick=()=>$('overlay').classList.add('hidden');$('saveCal').onclick=()=>{const r=rows.find(r=>r.id===editing);if(r)r.dates=[...selected].sort();$('overlay').classList.add('hidden');save()};$('add').onclick=()=>addRow();
function shifts(){let out=[];for(const r of rows){if(!r.enabled)continue;const [sh,sm]=(r.start||'').split(':').map(Number),[eh,em]=(r.end||'').split(':').map(Number);if(!Number.isFinite(sh)||!Number.isFinite(sm)||!Number.isFinite(eh)||!Number.isFinite(em)||!(+r.rate>0))continue;for(const date of r.dates){const [y,m,d]=date.split('-').map(Number),from=new Date(y,m-1,d,sh,sm),to=new Date(y,m-1,d,eh,em);if(to<=from)to.setDate(to.getDate()+1);out.push({id:r.id+'-'+date,from:+from,to:+to,wage:+r.rate})}}return out}
function applySettings(){const w=+$('wage').value,h=+$('hours').value||0,m=+$('minutes').value||0;if(!(w>0)||!Number.isInteger(h)||h<0||!Number.isInteger(m)||m<0||m>59)return false;state.wage=w;state.duration=(h*60+m)*60;return true}
function draw(){const s=state;$('money').textContent=money(s.earned);$('elapsed').textContent=clock(s.elapsed);$('remaining').textContent=s.duration?clock(s.duration-s.elapsed):'--:--:--';$('perMinute').textContent=yen(s.wage/60);$('target').textContent=s.duration?yen(s.wage*s.duration/3600):'未設定';const p=s.duration?Math.min(100,s.elapsed/s.duration*100):0;$('progress').style.width=p+'%';$('percent').textContent=s.duration?Math.floor(p)+'%':'時間未設定';$('rank').textContent='RANK '+(1+Math.floor(s.earned/1000));$('message').textContent=s.status==='paused'?'☕ ひと休み！再開を待ってるよ':s.status==='running'?(s.duration&&p>=90?'🏁 ラストスパート！あと少し！':s.duration&&p>=50?'✨ 半分突破！すごいぞ！':s.elapsed>600?'💪 コツコツ稼いでるね！':'🔥 いい調子！そのままいこう！'):'🌱 今日もがんばろう！';const busy=s.status==='running'||s.status==='paused';['wage','hours','minutes'].forEach(id=>$(id).disabled=s.status==='running');$('start').disabled=busy;$('pause').disabled=!busy||s.mode==='scheduled';$('pause').textContent=s.status==='paused'?'▶ 再開':'⏸ 一時停止';$('stop').disabled=!busy}
function accrue(now){if(state.status!=='running')return;const prev=state.last||now,limit=state.duration?Math.max(0,(state.duration-state.elapsed)*1000):Infinity,dt=Math.max(0,Math.min(now-prev,limit));state.elapsed+=dt/1000;state.earned+=state.wage*dt/3600000;state.last=now}
function finish(){if(state.status==='running')accrue(Date.now());if(state.mode==='scheduled'&&state.active)completedShifts.add(state.active);state.status='finished';$('finalMoney').textContent=yen(state.earned);$('finalTime').textContent=clock(state.elapsed);$('finalRank').textContent='RANK '+(1+Math.floor(state.earned/1000));$('home').classList.add('hidden');$('end').classList.remove('hidden');const box=$('confetti');box.innerHTML='';const colors=['#65f49c','#f8dc70','#ff84a9','#83d4ff','#fff'];for(let i=0;i<70;i++){let el=document.createElement('span');el.className='piece';el.style.left=Math.random()*100+'%';el.style.setProperty('--c',colors[i%colors.length]);el.style.setProperty('--delay',Math.random()*1.4+'s');el.style.setProperty('--dur',2+Math.random()*2+'s');el.style.setProperty('--drift',(Math.random()-.5)*150+'px');box.appendChild(el)}save()}
function tick(){const now=Date.now();if(state.status==='running'){const shift=state.mode==='scheduled'?shifts().find(x=>x.id===state.active):null;if(state.mode==='scheduled'&&!shift){finish();return}accrue(shift?Math.min(now,shift.to):now);if((shift&&now>=shift.to)||(state.duration&&state.elapsed>=state.duration)){finish();return}}else if(state.status==='idle'){const shift=shifts().find(x=>now>=x.from&&now<x.to&&!completedShifts.has(x.id));if(shift){state={status:'running',mode:'scheduled',wage:shift.wage,duration:(shift.to-shift.from)/1000,elapsed:(now-shift.from)/1000,earned:shift.wage*(now-shift.from)/3600000,last:now,active:shift.id};$('wage').value=shift.wage;$('hours').value=Math.floor(state.duration/3600);$('minutes').value=pad(state.duration%3600/60);save()}}if(state.status!=='finished')draw()}
$('start').onclick=()=>{if(state.status==='running'||state.status==='paused')return;if(!applySettings()){$('message').textContent='⚠ 入力内容を確認してね';return}state={...state,status:'running',mode:'manual',elapsed:0,earned:0,last:Date.now(),active:null};draw();save()};$('pause').onclick=()=>{if(state.mode==='scheduled')return;if(state.status==='running'){accrue(Date.now());state.status='paused'}else if(state.status==='paused'){if(!applySettings()){$('message').textContent='⚠ 時給と勤務時間を確認してね';return}if(state.duration&&state.elapsed>=state.duration){finish();return}state.status='running';state.last=Date.now()}draw();save()};$('stop').onclick=()=>{if(state.status==='running'||state.status==='paused')finish()};function reset(){state={status:'idle',mode:'manual',wage:+$('wage').value||1200,duration:0,elapsed:0,earned:0,last:0,active:null};$('end').classList.add('hidden');$('home').classList.remove('hidden');draw();save()}$('reset').onclick=reset;$('again').onclick=reset;['wage','hours','minutes'].forEach(id=>$(id).addEventListener('input',()=>{if(state.status==='paused'){if(applySettings())draw()}else if(state.status==='idle'){if(applySettings())draw()}save()}));
try{const s=JSON.parse(localStorage.getItem('bq-v7-original-chat')||'null');if(s){state=s.state||state;rows=Array.isArray(s.rows)?s.rows:[];counter=s.counter||rows.length;completedShifts=new Set(s.completed||[]);$('wage').value=s.wage??1200;$('hours').value=s.hours??'';$('minutes').value=s.minutes??'';if(state.status==='running'){state.status='paused';state.last=Date.now()}}}catch(e){}if(!rows.length)rows.push({id:'r'+(++counter),enabled:true,start:'09:00',end:'17:00',rate:'1200',dates:[]});renderRows();draw();setInterval(tick,100);setInterval(save,5000);
})();
</script></body></html>
