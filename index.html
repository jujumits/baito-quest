<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#123d30">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baito Quest">
<link rel="manifest" href="manifest.webmanifest">
<title>Baito Quest</title>
<style>
:root{color-scheme:dark;--bg:#092b22;--panel:#123d30;--line:#28664e;--mint:#c5f5d9;--green:#65f09a;--btn:#38d879}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(160deg,#092b22,#071b15);color:#fff;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;padding:env(safe-area-inset-top) 14px calc(22px + env(safe-area-inset-bottom));}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:12px;padding-top:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:14px;box-shadow:0 8px 22px #0002}
.brand{text-align:center;color:var(--mint);font-size:13px;font-weight:800;letter-spacing:.18em}
.earned-label{margin-top:12px;text-align:center;color:var(--mint);font-size:13px}
.money{text-align:center;font-size:clamp(36px,10vw,52px);font-weight:900;color:var(--green);font-variant-numeric:tabular-nums;letter-spacing:-1.5px;overflow-wrap:anywhere}
.status{text-align:center;color:var(--mint);font-size:13px;margin-top:5px;min-height:20px}
summary{list-style:none;cursor:pointer;font-weight:800;color:var(--mint);display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}.arrow{transition:transform .15s}details[open] .arrow{transform:rotate(180deg)}
label{display:block;color:var(--mint);font-size:12px;margin-bottom:5px}
input{width:100%;min-width:0;background:var(--bg);color:#fff;border:1px solid #47866b;border-radius:9px;padding:11px;font:inherit;font-size:16px}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--btn);padding:0}
button{border:0;border-radius:10px;padding:12px 10px;font:inherit;font-size:14px;font-weight:800;cursor:pointer}
button:disabled,input:disabled{opacity:.45}.primary{background:var(--btn);color:#073321}.secondary{background:#28664e;color:#fff}.danger{background:#743b3b;color:#fff}
.muted{color:var(--mint);font-size:11px;line-height:1.55}
.schedule-head,.schedule-row{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 40px;gap:6px;align-items:end}
.schedule-head{font-size:10px;color:var(--mint);text-align:center;margin-top:15px}
.schedule-row{padding:10px 0;border-bottom:1px solid var(--line)}
.schedule-row input{padding:9px 4px;font-size:13px}
.check-cell{align-self:center;display:flex;justify-content:center;padding-top:16px}
.cal-btn{width:40px;height:39px;padding:0;background:#28664e;font-size:20px}
.date-note{grid-column:2/-1;color:var(--mint);font-size:10px;overflow-wrap:anywhere;margin-top:-2px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.duration{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.duration input{text-align:center}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#0b3025;border-radius:11px;padding:11px;min-width:0}
.stat span{display:block;color:var(--mint);font-size:11px}.stat strong{display:block;font-size:18px;margin-top:4px;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.progressline{height:11px;background:#06251b;border-radius:20px;overflow:hidden}.progressfill{height:100%;width:0;background:var(--green);transition:width .2s}
.rank{text-align:center;color:#f5d76e;font-size:25px;font-weight:900;margin-top:5px}
.modal{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
.modal.hidden{display:none}.calendar{width:min(100%,420px);background:#123d30;border:1px solid #47866b;border-radius:17px;padding:15px;box-shadow:0 15px 50px #0008}
.monthnav{display:flex;align-items:center;justify-content:space-between;margin:12px 0}.monthnav button{background:#28664e;color:white;padding:8px 14px}
.week,.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;text-align:center}.week{font-size:11px;color:var(--mint);margin-bottom:7px}
.day{background:#174b39;color:white;padding:10px 0;border:1px solid transparent;border-radius:8px}.day.selected{background:var(--btn);color:#073321}.day.today{border-color:#f5d76e}.blank{min-height:36px}
.modal-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:14px}
@media(max-width:360px){body{padding-left:9px;padding-right:9px}.panel{padding:11px}.schedule-row,.schedule-head{grid-template-columns:19px minmax(0,1fr) minmax(0,1fr) minmax(0,1fr) 36px;gap:4px}.cal-btn{width:36px}}
</style>
</head>
<body>
<main>
<section class="panel">
 <div class="brand">BAITO QUEST</div><div class="earned-label">現在の獲得金額</div>
 <div id="money" class="money">¥0.00</div><div id="status" class="status">準備OK！時給を設定しよう</div>
</section>
<details class="panel" id="scheduleFold">
 <summary><span>スケジュール設定</span><span class="arrow">⌄</span></summary>
 <div class="schedule-head"><span></span><span>開始時間</span><span>終了時間</span><span>時給</span><span>日程</span></div>
 <div id="scheduleRows"></div>
 <button id="addRow" class="secondary" style="width:100%;margin-top:12px">＋ スケジュールを追加</button>
 <p class="muted">左のチェックをONにした予定だけ自動適用。カレンダーから複数の日付を選べるよ。</p>
</details>
<section class="panel">
 <b style="color:var(--mint);display:block;margin-bottom:12px">勤務設定</b>
 <div class="two">
  <div><label for="wage">時給（円）</label><input id="wage" type="number" min="1" step="1" value="1200" inputmode="numeric"></div>
  <div><label>勤務時間</label><div class="duration">
   <div><input id="hours" type="number" min="0" step="1" placeholder="0" inputmode="numeric"><div class="muted" style="text-align:center">時間</div></div>
   <div><input id="minutes" type="number" min="0" max="59" step="1" value="00" inputmode="numeric"><div class="muted" style="text-align:center">分</div></div>
  </div></div>
 </div>
 <p class="muted" style="margin:9px 0 12px">勤務時間を空欄にすると、停止するまで計測を続けるよ。</p>
 <div class="actions"><button id="start" class="primary">▶ 今すぐスタート</button><button id="pause" class="secondary" disabled>一時停止</button><button id="resume" class="secondary" disabled>再開</button><button id="reset" class="danger">リセット</button></div>
</section>
<section class="panel">
 <div class="stats">
  <div class="stat"><span>経過時間</span><strong id="elapsed">00:00:00</strong></div>
  <div class="stat"><span>残り時間</span><strong id="remaining">--:--:--</strong></div>
  <div class="stat"><span>1分あたり</span><strong id="perMinute">¥20.00</strong></div>
  <div class="stat"><span>今日の目標金額</span><strong id="target">未設定</strong></div>
 </div>
 <div style="display:flex;justify-content:space-between;color:var(--mint);font-size:12px;margin:16px 0 8px"><span>勤務進捗</span><b id="progressText">時間未設定</b></div>
 <div class="progressline"><div id="progress" class="progressfill"></div></div>
 <div class="muted" style="text-align:center;margin-top:13px">現在のランク</div><div id="rank" class="rank">RANK 1</div>
</section>
<p class="muted" style="text-align:center">獲得金額＝時給 ÷ 3,600 × 経過秒数（小数点以下2桁表示）</p>
</main>
<div id="calendarModal" class="modal hidden">
 <div class="calendar">
  <b>勤務する日を選択</b>
  <div class="monthnav"><button id="prevMonth">‹</button><strong id="monthTitle"></strong><button id="nextMonth">›</button></div>
  <div class="week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div>
  <div id="calendarDays" class="days"></div>
  <div class="modal-actions"><span id="selectedCount" class="muted">0日選択中</span><div style="display:flex;gap:7px"><button id="cancelCalendar" class="secondary">閉じる</button><button id="saveCalendar" class="primary">保存</button></div></div>
 </div>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id), pad=n=>String(n).padStart(2,'0');
const fmtMoney=n=>'¥'+Math.max(0,n).toLocaleString('ja-JP',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtYen=n=>'¥'+Math.floor(Math.max(0,n)).toLocaleString('ja-JP');
const clock=s=>{s=Math.max(0,Math.floor(s));return `${pad(Math.floor(s/3600))}:${pad(Math.floor(s%3600/60))}:${pad(s%60)}`};
let running=false,paused=false,mode='manual',wage=1200,duration=0,elapsed=0,startedAt=0,timer=null,activeId=null;
let rowSeq=0,editingRow=null,month=new Date(),selected=new Set(),manualSession=null;
const STORAGE='baitoQuestMobileV1';
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
function save(){
 const data={wage:$('wage').value,hours:$('hours').value,minutes:$('minutes').value,
 schedules:[...$('scheduleRows').querySelectorAll('.schedule-row')].map(r=>({
 enabled:r.querySelector('.enabled').checked,start:r.querySelector('.start-time').value,
 end:r.querySelector('.end-time').value,rate:r.querySelector('.rate').value,
 dates:r.dataset.dates||''
 })),session:{running,paused,mode,duration,elapsed,startedAt,wage,activeId}};
 try{localStorage.setItem(STORAGE,JSON.stringify(data))}catch(e){}
}
function setStatus(s){$('status').textContent=s}
function draw(){
 const earned=wage*elapsed/3600;
 $('money').textContent=fmtMoney(earned);$('elapsed').textContent=clock(elapsed);
 $('remaining').textContent=duration?clock(Math.max(0,duration-elapsed)):'--:--:--';
 $('perMinute').textContent='¥'+(wage/60).toFixed(2);
 $('target').textContent=duration?fmtYen(wage*duration/3600):'未設定';
 const pct=duration?Math.min(100,elapsed/duration*100):0;
 $('progress').style.width=pct+'%';$('progressText').textContent=duration?Math.floor(pct)+'%':'時間未設定';
 $('rank').textContent='RANK '+(Math.floor(earned/1000)+1);
 $('start').disabled=running||paused;$('pause').disabled=!running||mode==='scheduled';$('resume').disabled=!paused;
 ['wage','hours','minutes'].forEach(id=>$(id).disabled=running||paused);
}
function addRow(data={}){
 const row=document.createElement('div');row.className='schedule-row';row.dataset.rowid='row-'+(++rowSeq);
 row.innerHTML=`<div class="check-cell"><input class="enabled" type="checkbox" aria-label="予定を有効にする"></div>
 <div><input class="start-time" type="text" inputmode="numeric" placeholder="09:00" aria-label="開始時間"></div>
 <div><input class="end-time" type="text" inputmode="numeric" placeholder="17:00" aria-label="終了時間"></div>
 <div><input class="rate" type="number" min="1" step="1" inputmode="numeric" aria-label="時給"></div>
 <div><button class="cal-btn" aria-label="カレンダーを開く">▦</button></div>
 <div class="date-note"></div>`;
 row.querySelector('.enabled').checked=data.enabled??true;
 row.querySelector('.start-time').value=data.start||'09:00';
 row.querySelector('.end-time').value=data.end||'17:00';
 row.querySelector('.rate').value=data.rate||$('wage').value||1200;
 row.dataset.dates=data.dates||'';
 row.querySelector('.cal-btn').addEventListener('click',()=>openCalendar(row));
 row.querySelectorAll('input').forEach(el=>el.addEventListener('change',save));
 row.querySelector('.date-note').textContent=row.dataset.dates?row.dataset.dates.split(',').join(' / '):'日付未選択';
 $('scheduleRows').appendChild(row);return row;
}
function openCalendar(row){
 editingRow=row;selected=new Set((row.dataset.dates||'').split(',').filter(Boolean));
 month=new Date();month.setDate(1);renderCalendar();$('calendarModal').classList.remove('hidden');
}
function renderCalendar(){
 const y=month.getFullYear(),m=month.getMonth(),first=new Date(y,m,1).getDay(),last=new Date(y,m+1,0).getDate();
 $('monthTitle').textContent=`${y}年 ${m+1}月`;const box=$('calendarDays');box.innerHTML='';
 for(let i=0;i<first;i++){const blank=document.createElement('span');blank.className='blank';box.appendChild(blank)}
 const today=new Date();
 for(let d=1;d<=last;d++){
  const key=`${y}-${pad(m+1)}-${pad(d)}`,b=document.createElement('button');b.className='day';b.textContent=d;
  if(selected.has(key))b.classList.add('selected');
  if(today.getFullYear()===y&&today.getMonth()===m&&today.getDate()===d)b.classList.add('today');
  b.addEventListener('click',()=>{selected.has(key)?selected.delete(key):selected.add(key);renderCalendar()});box.appendChild(b);
 }
 $('selectedCount').textContent=`${selected.size}日選択中`;
}
function closeCalendar(){$('calendarModal').classList.add('hidden');editingRow=null}
$('prevMonth').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()-1,1);renderCalendar()};
$('nextMonth').onclick=()=>{month=new Date(month.getFullYear(),month.getMonth()+1,1);renderCalendar()};
$('cancelCalendar').onclick=closeCalendar;
$('saveCalendar').onclick=()=>{if(editingRow){editingRow.dataset.dates=[...selected].sort().join(',');editingRow.querySelector('.date-note').textContent=selected.size?[...selected].sort().join(' / '):'日付未選択';editingRow.querySelector('.cal-btn').textContent=selected.size?'📅':'▦';save()}closeCalendar()};
$('addRow').onclick=()=>{addRow();save()};
function parseTime(v){const m=/^(\d{1,2}):(\d{2})$/.exec(v.trim());if(!m)return null;const h=+m[1],n=+m[2];return h<=23&&n<=59?{h,n}:null}
function schedules(){
 const out=[];$('scheduleRows').querySelectorAll('.schedule-row').forEach(r=>{
  if(!r.querySelector('.enabled').checked)return;
  const a=parseTime(r.querySelector('.start-time').value),b=parseTime(r.querySelector('.end-time').value),rate=+r.querySelector('.rate').value;
  if(!a||!b||!Number.isFinite(rate)||rate<=0)return;
  (r.dataset.dates||'').split(',').filter(Boolean).forEach(date=>{
   const [y,m,d]=date.split('-').map(Number),from=new Date(y,m-1,d,a.h,a.n),to=new Date(y,m-1,d,b.h,b.n);
   if(to<=from)to.setDate(to.getDate()+1);
   out.push({id:r.dataset.rowid+'-'+date,from,to,rate});
  });
 });
 return out;
}
function tick(){
 const now=Date.now();
 if(mode==='scheduled'&&activeId){
  const s=schedules().find(x=>x.id===activeId);
  if(s&&now<s.to.getTime()){elapsed=Math.max(0,(now-s.from.getTime())/1000);draw();save();return}
  running=false;paused=false;mode='manual';activeId=null;setStatus('予定の終了時刻！おつかれさま');draw();save();return;
 }
 if(!running)return;
 const s=schedules().find(x=>now>=x.from.getTime()&&now<s.to.getTime());
 if(s&&!running){
  running=true;mode='scheduled';activeId=s.id;wage=s.rate;duration=(s.to-s.from)/1000;elapsed=(now-s.from)/1000;startedAt=s.from.getTime();
  $('wage').value=wage;$('hours').value=Math.floor(duration/3600);$('minutes').value=pad(Math.floor(duration%3600/60));
  setStatus('📅 スケジュール開始！自動計測中');draw();save();return;
 }
 if(!running)return;
 elapsed=(now-startedAt)/1000;
 if(duration&&elapsed>=duration){elapsed=duration;running=false;setStatus('勤務終了！おつかれさま！')}
 draw();save();
}
function startLoop(){stopTimer();timer=setInterval(tick,200)}
$('start').onclick=()=>{
 const w=+$('wage').value,hs=$('hours').value.trim(),ms=$('minutes').value.trim(),h=hs===''?0:+hs,m=ms===''?0:+ms,has=hs!==''||(ms!==''&&m!==0),sec=(h*60+m)*60;
 if(!Number.isFinite(w)||w<=0){setStatus('時給を正しく入力してね');return}
 if(!Number.isInteger(h)||h<0||!Number.isInteger(m)||m<0||m>59||(has&&sec===0)){setStatus('勤務時間を正しく入力してね');return}
 wage=w;duration=has?sec:0;elapsed=0;startedAt=Date.now();running=true;paused=false;mode='manual';activeId=null;setStatus('勤務スタート！');startLoop();draw();save();
};
$('pause').onclick=()=>{if(!running||mode==='scheduled')return;elapsed=(Date.now()-startedAt)/1000;running=false;paused=true;setStatus('一時停止中');draw();save()};
$('resume').onclick=()=>{if(!paused)return;paused=false;running=true;startedAt=Date.now()-elapsed*1000;setStatus('勤務再開！');startLoop();draw();save()};
$('reset').onclick=()=>{stopTimer();running=false;paused=false;mode='manual';activeId=null;elapsed=0;duration=0;startedAt=0;$('wage').disabled=false;$('hours').disabled=false;$('minutes').disabled=false;setStatus('リセット完了！予定は保存してあるよ');draw();save();startLoop()};
['wage','hours','minutes'].forEach(id=>$(id).addEventListener('change',save));
function restore(){
 let data;try{data=JSON.parse(localStorage.getItem(STORAGE)||'null')}catch(e){}
 if(!data){addRow();return}
 $('wage').value=data.wage||1200;$('hours').value=data.hours||'';$('minutes').value=data.minutes??'00';
 $('scheduleRows').innerHTML='';(data.schedules||[]).forEach(s=>addRow(s));if(!data.schedules?.length)addRow();
 const s=data.session;
 if(s){
  wage=s.wage||1200;duration=s.duration||0;elapsed=s.elapsed||0;startedAt=s.startedAt||0;
  if(s.running&&s.mode==='manual'){running=true;mode='manual';elapsed=Math.max(0,(Date.now()-startedAt)/1000);setStatus('勤務を継続中')}
  else if(s.running&&s.mode==='scheduled'){running=true;mode='scheduled';activeId=s.activeId;setStatus('スケジュール勤務を継続中')}
  else if(s.paused){paused=true;mode='manual';setStatus('一時停止状態を復元')}
 }
 draw();
}
restore();startLoop();tick();
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
})();
</script>
</body></html>
